version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "ci"]
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "frontend"]
    groups:
      npm-all:
        patterns:
          - "*"
    # No typescript-eslint release accepts TypeScript >= 6.1: 8.65.0 (latest,
    # and there is no v9) still peers `typescript: >=4.8.4 <6.1.0`. A grouped
    # bump that raises frontend's `~6.0.2` pin fails `npm ci` with ERESOLVE
    # before a single check runs, which takes the whole npm-all PR down with
    # it — one unsatisfiable dependency blocks every other update in the batch.
    # Hold typescript until typescript-eslint ships support, then drop this
    # block and bump the two together.
    ignore:
      - dependency-name: "typescript"
        versions: [">=6.1.0"]

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "backend"]
    groups:
      python-all:
        patterns:
          - "*"
    # aioboto3 pins an exact aiobotocore, which pins a narrow botocore range
    # (e.g. aiobotocore 2.25.1 → botocore <1.40.62). Bumping boto3/botocore on
    # their own makes the lock unresolvable, and the failed update job fails
    # the whole "Dependabot Updates" run. They move only when aioboto3 is bumped
    # (it pulls the matching boto3 via aiobotocore[boto3]), so let that drive.
    ignore:
      - dependency-name: "boto3"
      - dependency-name: "botocore"
